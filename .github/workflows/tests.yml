name: tests
on:
  push:
    branches: [main, independent_research, benchmark-a-current-hive-budget-guard, fix/synthesis-context-bounds, fix/token-reservation-estimation]
  workflow_dispatch:
  pull_request:
    branches: [main, independent_research]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
