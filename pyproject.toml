[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rave-hive-core"
version = "0.1.0"
description = "Experimental hybrid multi-agent research system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rave = "rave.cli:main"

[tool.setuptools.packages.find]
include = ["rave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
